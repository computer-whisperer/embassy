[package]
name = "cyw43"
version = "0.7.0"
edition = "2024"
description = "Rust driver for the CYW43439 WiFi chip, used in the Raspberry Pi Pico W."
keywords = ["embedded", "cyw43", "embassy-net", "embedded-hal-async", "wifi"]
categories = ["embedded", "hardware-support", "no-std", "network-programming", "asynchronous"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/embassy-rs/embassy"
documentation = "https://docs.embassy.dev/cyw43"

[features]
defmt = ["dep:defmt", "heapless/defmt", "embassy-time/defmt", "bt-hci?/defmt", "embedded-io-async?/defmt"]
log = ["dep:log", "dep:derive_more", "derive_more/display"]
bluetooth = ["dep:bt-hci", "dep:embedded-io-async"]

# Fetch console logs from the WiFi firmware and forward them to `log` or `defmt`.
firmware-logs = []

# Diagnostic: compare one byte from bulk BT ring-buffer reads against a direct
# single-byte backplane read at the same address. Helps localize RX corruption.
bt-rx-byte-probe = []

# Diagnostic: scan inbound HCI ACL payloads for a sentinel block and report
# mismatches immediately (no extra bus reads).
bt-rx-sentinel-probe = []

# Diagnostic: after reading BT2HOST payload bytes from CYW43 ring, immediately
# reread the same bytes and compare before publishing BT2HOST_OUT.
bt-rx-readback-probe = []

# Diagnostic: validate deterministic BLE SPI repro payloads at two TX points:
# bt-hci transport write and runner HCI write just before bus transfer.
bt-tx-repro-diag = []

# Diagnostic: after BT host writes packet bytes into CYW43 ring buffer, read
# the same bytes back before publishing HOST2BT_IN and compare.
bt-tx-readback-probe = ["bt-tx-repro-diag"]

# Diagnostic: mirror Pico cybt_shared_bus guardrails for HOST_CTRL bitmask/cache
# handling plus strict BT ring pointer/window assertions.
bt-sharedbus-strict-checks = []

# Diagnostic: periodically sample HOST_CTRL from hardware and compare against
# driver cache without asserting, to detect runtime drift with low overhead.
bt-hostctrl-cache-sample = []

# SPI tuning knobs for BLE-SPI corruption triage.
spi-no-high-speed = []
spi-resp-delay-2 = []
spi-resp-delay-8 = []
backplane-max-transfer-16 = []
backplane-max-transfer-32 = []
spi-wlan-write-guard = []
spi-irq-extended-handle = []

# BT event-loop mode for BLE-SPI corruption triage.
bt-event-irq-wait = []

# BT shared-ring timing/ordering probes for BLE-SPI corruption triage.
bt-ring-intr-set = []
bt-ring-pointer-stable-read = []
bt-ring-pointer-write-readback = []
bt-ring-tx-publish-delay-10us = []
bt-ring-tx-intr-delay-10us = []
bt-ring-rx-out-delay-10us = []
bt-ring-rx-intr-delay-10us = []

[dependencies]
embassy-time = { version = "0.5.1", path = "../embassy-time"}
embassy-sync = { version = "0.8.0", path = "../embassy-sync"}
embassy-futures = { version = "0.1.2", path = "../embassy-futures"}
embassy-net-driver-channel = { version = "0.4.0", path = "../embassy-net-driver-channel"}

defmt = { version = "1.0.1", optional = true }
log = { version = "0.4.17", optional = true }
derive_more = { version = "2.1.1", optional = true, default-features =false }

cortex-m = "0.7.6"
cortex-m-rt = "0.7.0"
futures = { version = "0.3.17", default-features = false, features = ["async-await", "cfg-target-has-atomic", "unstable"] }

embedded-hal-1 = { package = "embedded-hal", version = "1.0" }
embedded-hal-async = { version = "1.0" }
heapless = "0.9"
aligned = "0.4.3"

# Bluetooth deps
embedded-io-async = { version = "0.7.0", optional = true }
bt-hci = { version = "0.8", optional = true }

[package.metadata.embassy]
build = [
    {target = "thumbv6m-none-eabi", features = []},
    {target = "thumbv6m-none-eabi", features = ["log"]},
    {target = "thumbv6m-none-eabi", features = ["defmt"]},
    {target = "thumbv6m-none-eabi", features = ["firmware-logs", "log"]},
    {target = "thumbv6m-none-eabi", features = ["defmt", "firmware-logs"]},
    {target = "thumbv6m-none-eabi", features = ["bluetooth", "firmware-logs", "log"]},
    {target = "thumbv6m-none-eabi", features = ["bluetooth", "defmt", "firmware-logs"]},
]

[package.metadata.embassy_docs]
src_base = "https://github.com/embassy-rs/embassy/blob/cyw43-v$VERSION/cyw43/src/"
src_base_git = "https://github.com/embassy-rs/embassy/blob/$COMMIT/cyw43/src/"
target = "thumbv6m-none-eabi"
features = ["defmt", "firmware-logs"]

[package.metadata.docs.rs]
features = ["defmt", "firmware-logs"]
